# Corre los tests en cada Pull Request hacia main y en cada push a main.
# No necesita el dataset: los tests con datos reales se omiten solos (marca `data`).
# Instala torch en build CPU (~200 MB, sin CUDA) porque el paquete `pengwin_orozco`
# (rama orozco) lo importa; el resto usa phantoms sintéticos. Tiempo ~2 minutos.
# Activen este check como obligatorio en la protección de main.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias mínimas (versiones de requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install numpy==2.3.5 scipy==1.16.3 SimpleITK==2.5.6 pandas==2.3.3 PyYAML==6.0.3 pytest==8.4.2
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps
      - name: pytest
        run: python -m pytest -v
