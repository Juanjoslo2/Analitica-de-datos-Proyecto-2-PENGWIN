# Configuración base del proyecto. Cada valor viene de una decisión documentada:
#   [EDA §n] -> 04_notebook/01_eda_pengwin.ipynb, sección n
#   [DD]     -> reports/decisiones_de_diseno.md
# Las ablaciones heredan este archivo y cambian SOLO lo que estudian.

seed: 42

data:
  raw_dir: 01_data
  splits: 01_data/splits.json            # v2, sha256 dentro del archivo [EDA §9]
  processed_dir: data_processed          # caché de cortes (no versionado)
  orientation: LPS                       # 34/100 casos vienen en RAS [EDA §1]
  crop: bone                             # recorte óseo por volumen: 1,27 vs 1,56 mm/px [EDA §2]
  crop_margin_mm: 15
  image_size: 256
  context_mm: 2.0                        # 2.5D: canales (z-Δ, z, z+Δ), Δ = round(2 mm / dz) [EDA §2]
  hu_clip: [-1024, 3071]                 # relleno hasta -6211 HU; metal hasta ~47 000 HU [EDA §3-4]
  window: {level: 400, width: 1800}      # deja sin saturar el 99,6 % del hueso [EDA §3]
  empty_slice_fraction: 0.12             # negativos para la cabeza de clasificación [EDA §8]

model:
  backbone: fundidora_r                  # FundidoraPC + residual por bloque [DD §8]; "fundidora" = versión del curso
  widths: [32, 64, 128, 256]             # los de FundidoraPC: permite cargar sus pesos tal cual
  pretrained: true                       # ablación: false (ablation_scratch.yaml)
  pretrained_weights: checkpoints/fundidora_taller3.pth   # FundidoraPC del Taller 3 (no se versiona: Releases)
  cbam: true                             # ablación: false
  cbam_blocks: [3, 4]                    # CBAM en C3 y C4, antes de la bifurcación hacia las 3 cabezas
  cbam_reduction: 16
  cbam_gamma: true                       # y = x + γ·(CBAM(x) − x), γ aprendible desde 0: mide cuánto se usa CBAM
  neck_gamma: true                       # P3 = C3 + γ·up(C4), γ desde 1: mide cuánto contexto profundo se usa
  spatial_dropout: 0.1                   # Dropout2d tras los bloques profundos (val loss se aplanaba en ép. ~17)
  spatial_dropout_blocks: [3, 4]         # 128 y 256 canales; los bloques 1-2 llevan bordes finos
  seg_spatial_dropout: 0.1               # en el decodificador a stride 4 (64 canales)
  neck_channels: 128                     # P3 = C3 + up(C4)
  num_classes: 3                         # SA, coxal izq., coxal der.
  det_stride: 8                          # 39 % de cajas del sacro < 16 px [EDA §8]
  det_min_box_px: 4                      # cajas GT más pequeñas se marcan como "ignorar"
  seg_outputs: [semantic4, fracture_edge]

loss:
  terms: [cls, det, seg]                 # la distancia NO es un término de pérdida [DD §4]
  lambdas: auto                          # calibración por norma de gradiente [DD §4] -> lambdas_file
  lambdas_file: reports/lambdas.json     # lo escribe scripts/calibrate_lambdas.py
  lambda_calibration_iters: 200
  seg_ce_weights: [1.0, 10.8, 8.7, 8.7]  # fondo, SA, LI, RI ∝ 1/sqrt(frecuencia) [EDA §8]
  edge_dilation_px: 2
  edge_pos_weight: 9                     # √(hueso:borde) del objetivo REAL: borde 3D dilatado = 1:83 (antes 21, de 1:446 sin dilatar)
  focal_alpha: 0.25                      # pérdida focal del grid (~1 % de celdas positivas)
  focal_gamma: 2.0
  center_radius: 1.5                     # celdas positivas a <= 1,5 celdas del centro de la caja

augment:                                 # solo en train; SIN flip horizontal [DD §1]
  scale: [0.9, 1.1]
  rotate_deg: 10
  translate: 0.05                        # fracción del lado
  gamma: [0.8, 1.25]
  contrast: [0.9, 1.1]
  brightness: 0.05

train:
  batch_size: 8
  epochs: 40
  lr: 3.0e-4
  backbone_lr_factor: 1.0                # < 1 para afinar más despacio el backbone preentrenado
  weight_decay: 1.0e-4
  grad_clip: 10.0
  amp: true                              # torch.amp (API actual de torch.cuda.amp) obligatorio
  num_workers: 4                         # Windows: 0-2 si el DataLoader se vuelve lento

overfit_test:                            # semana 9: prueba de correctitud [DD §5]
  n_slices: 8
  max_steps: 500
  augment: false
  accept: {loss_drop: 0.95, dice: 0.95, map50: 0.95}

postprocess:
  det_score_threshold: 0.3               # sigmoide del grid antes de la NMS
  nms_iou: 0.5
  max_boxes_per_class: 1                 # una región aparece a lo sumo una vez por corte
  min_fragment_cm3: 0.1                  # componentes 3D menores se reasignan [EDA §6]
  instance_method: edt                   # semillas por distancia: val 67 % de secundarios recuperados vs 2 % solo-borde [DD §10.7]
  seed_depth_mm: 5.0                     # semilla = zona a > 5 mm del borde del núcleo (barrido en val: 2-10 mm)
  edge_threshold: 0.2                    # P(borde) ≥ umbral sale del núcleo (val: 0,2 > 0,5)

measurement:
  contact_threshold: voxel_diagonal      # d <= diagonal del vóxel => "en contacto" [EDA §7]
