# Configuración base del proyecto. Cada valor viene de una decisión documentada:
#   [EDA §n] -> 04_notebook/01_eda_pengwin.ipynb, sección n
#   [DD]     -> reports/decisiones_de_diseno.md
# Las ablaciones heredan este archivo y cambian SOLO lo que estudian.

seed: 42

data:
  raw_dir: 01_data
  splits: 01_data/splits.json            # v2, sha256 dentro del archivo [EDA §9]
  processed_dir: data_processed          # caché de cortes (no versionado)
  orientation: LPS                       # 34/100 casos vienen en RAS [EDA §1]
  crop: bone                             # recorte óseo por volumen: 1,27 vs 1,56 mm/px [EDA §2]
  crop_margin_mm: 15
  image_size: 256
  context_mm: 2.0                        # 2.5D: canales (z-Δ, z, z+Δ), Δ = round(2 mm / dz) [EDA §2]
  hu_clip: [-1024, 3071]                 # relleno hasta -6211 HU; metal hasta ~47 000 HU [EDA §3-4]
  window: {level: 400, width: 1800}      # deja sin saturar el 99,6 % del hueso [EDA §3]
  empty_slice_fraction: 0.12             # negativos para la cabeza de clasificación [EDA §8]

model:
  backbone: fundidora_r                  # interfaz FundidoraPC; pesos ImageNet (ablación: pretrained=false)
  pretrained: true
  cbam: true                             # ablación: false
  num_classes: 3                         # SA, coxal izq., coxal der.
  det_stride: 8                          # 39 % de cajas del sacro < 16 px [EDA §8]
  det_min_box_px: 4                      # cajas GT más pequeñas se marcan como "ignorar"
  seg_outputs: [semantic4, fracture_edge]

loss:
  terms: [cls, det, seg]                 # la distancia NO es un término de pérdida [DD §4]
  lambdas: auto                          # calibración por norma de gradiente [DD §4]
  lambda_calibration_iters: 200
  seg_ce_weights: [1.0, 10.8, 8.7, 8.7]  # fondo, SA, LI, RI ∝ 1/sqrt(frecuencia) [EDA §8]
  edge_dilation_px: 2
  edge_pos_weight: 21                    # borde = 1:446 píxeles de hueso [EDA §8]

train:
  batch_size: 8
  epochs: 40
  lr: 3.0e-4
  weight_decay: 1.0e-4
  amp: true                              # torch.cuda.amp obligatorio
  num_workers: 4

overfit_test:                            # semana 9: prueba de correctitud [DD §5]
  n_slices: 8
  max_steps: 500
  augment: false
  accept: {loss_drop: 0.95, dice: 0.95, map50: 0.95}

postprocess:
  nms_iou: 0.5
  max_boxes_per_class: 1                 # una región aparece a lo sumo una vez por corte
  min_fragment_cm3: 0.1                  # componentes 3D menores se reasignan [EDA §6]

measurement:
  contact_threshold: voxel_diagonal      # d <= diagonal del vóxel => "en contacto" [EDA §7]
