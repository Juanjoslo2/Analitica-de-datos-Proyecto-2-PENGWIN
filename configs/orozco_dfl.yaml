# Configuración del intento PROPIO (rama orozco): detección con DFL.
# Hereda la base común y cambia solo lo que este intento necesita.
# Comparar contra el pipeline compartido con: mAP@0.5, mAP@[.5:.95], IoU promedio.

base: base.yaml

model:
  backbone: fundidora          # FundidoraPC pura del curso (S6), SIN residuales
  widths: [32, 64, 128, 256]   # mismo ancho por etapa que la clase
  cbam: true                   # CBAM propio (canal r=16 + espacial 7×7)
  cbam_blocks: [3, 4]
  cbam_reduction: 16
  det_stride: 8                # grid 32×32 sobre 256×256
  reg_max: 32                  # DFL: 32 bins por borde → cubre 31 celdas = 248 px
  center_radius: 1.5           # center sampling (celdas a ≤ 1.5 del centro)
  det_min_box_px: 4            # cajas GT menores → "ignorar" (no evaluables)

loss:
  focal_alpha: 0.25
  focal_gamma: 2.0

train:
  batch_size: 8
  epochs: 40
  lr: 3.0e-4
  num_workers: 0               # Windows + laptop: 0 (recomendación de clase)

overfit_test:
  n_slices: 8
  max_steps: 500
  augment: false
  # El criterio de caída se mide sobre la parte REGRESIVA (objectness + GIoU), no
  # sobre la total: el término DFL tiene un piso de entropía irreducible (los
  # targets fraccionarios no pueden alcanzar CE = 0), lo que impediría un drop
  # del 95 % en la total aun memorizando las 8 cajas a la perfección.
  accept: {core_drop: 0.95, map50: 0.95, iou: 0.95}